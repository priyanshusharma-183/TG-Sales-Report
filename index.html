<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TG Sales Report Generator</title>
<!-- PWA / installable on iPhone home screen -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TG Reports">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{
    --bg-0:#0b1020; --bg-1:#0f1733; --bg-2:#161e3f;
    --card:rgba(255,255,255,.045);
    --card-brd:rgba(255,255,255,.10);
    --ink:#eef2ff; --ink-soft:#aeb8de; --ink-dim:#7e88b0;
    --field:rgba(8,12,28,.55);
    --field-brd:rgba(255,255,255,.12);
    --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --p1a:#6366f1; --p1b:#22d3ee;
    --p2a:#d946ef; --p2b:#fb7185;
    --p3a:#f59e0b; --p3b:#f97316;
    --radius:18px;
    --shadow:0 20px 50px -20px rgba(0,0,0,.7);
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; color:var(--ink);
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(99,102,241,.30), transparent 60%),
      radial-gradient(1000px 600px at 110% 0%, rgba(217,70,239,.22), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(34,211,238,.16), transparent 60%),
      linear-gradient(160deg,var(--bg-0),var(--bg-1) 45%,var(--bg-2));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1320px;margin:0 auto;
    padding:calc(34px + env(safe-area-inset-top)) 22px calc(60px + env(safe-area-inset-bottom));
  }

  header{text-align:center;margin-bottom:22px;}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.4px;
    color:var(--ink-soft);background:var(--card);border:1px solid var(--card-brd);
    text-transform:uppercase;margin-bottom:16px;
  }
  .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);}
  h1{
    margin:0;font-size:clamp(26px,6vw,46px);font-weight:800;letter-spacing:-1px;line-height:1.05;
    background:linear-gradient(100deg,#fff,#c7d2fe 40%,#a5f3fc 70%,#f5d0fe);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{margin:12px auto 0;max-width:560px;color:var(--ink-soft);font-size:15px;}

  .toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:22px 0 18px;}
  .btn{
    cursor:pointer;border:0;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:.2px;
    padding:12px 22px;color:#fff;transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;
    display:inline-flex;align-items:center;gap:9px;-webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn-primary{background:linear-gradient(100deg,#6366f1,#8b5cf6 50%,#22d3ee);box-shadow:0 10px 30px -10px rgba(99,102,241,.8);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--card);border:1px solid var(--card-brd);color:var(--ink);}
  .btn-ghost:hover{background:rgba(255,255,255,.10);}

  /* Mobile segmented control (hidden on desktop) */
  .tabs{display:none;gap:8px;margin:0 auto 18px;max-width:620px;
    background:var(--card);border:1px solid var(--card-brd);border-radius:14px;padding:6px;}
  .tabs button{
    flex:1;border:0;border-radius:10px;padding:10px 6px;font-weight:700;font-size:13px;cursor:pointer;
    color:var(--ink-soft);background:transparent;transition:all .15s ease;-webkit-tap-highlight-color:transparent;
  }
  .tabs button .sub{display:block;font-size:10px;font-weight:600;opacity:.7;margin-top:2px;}
  .tabs button.active{color:#0b1020;}
  .tabs button[data-t="0"].active{background:linear-gradient(120deg,var(--p1a),var(--p1b));}
  .tabs button[data-t="1"].active{background:linear-gradient(120deg,var(--p2a),var(--p2b));}
  .tabs button[data-t="2"].active{background:linear-gradient(120deg,var(--p3a),var(--p3b));}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  @media(max-width:1080px){.grid{grid-template-columns:1fr;max-width:620px;margin:0 auto;}}

  .panel{
    position:relative;border-radius:var(--radius);padding:22px;
    background:var(--card);border:1px solid var(--card-brd);
    box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    overflow:hidden;transition:transform .2s ease,border-color .2s ease;
  }
  .panel:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2);}
  .panel::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent);}
  .panel::after{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-60px;border-radius:50%;
    background:var(--accent);opacity:.18;filter:blur(28px);pointer-events:none;}
  .panel[data-i="0"]{--accent:linear-gradient(120deg,var(--p1a),var(--p1b));}
  .panel[data-i="1"]{--accent:linear-gradient(120deg,var(--p2a),var(--p2b));}
  .panel[data-i="2"]{--accent:linear-gradient(120deg,var(--p3a),var(--p3b));}

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .panel-title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;}
  .panel-num{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:800;
    color:#0b1020;background:var(--accent);}
  .panel-tag{font-size:11px;font-weight:600;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.5px;}

  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.2px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  select,input,textarea{
    width:100%;color:var(--ink);background:var(--field);border:1px solid var(--field-brd);
    border-radius:11px;padding:11px 13px;font-size:16px;font-family:inherit;outline:none;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  select option{background:#0f1733;color:var(--ink);}
  input::placeholder,textarea::placeholder{color:var(--ink-dim);}
  select:focus,input:focus,textarea:focus{
    border-color:rgba(139,148,255,.8);box-shadow:0 0 0 3px rgba(99,102,241,.25);background:rgba(8,12,28,.75);}
  textarea{min-height:170px;resize:vertical;line-height:1.5;font-size:14px;}
  .hint{font-size:11px;color:var(--ink-dim);margin:6px 0 0;}

  .panel .btn{width:100%;justify-content:center;margin-top:14px;
    background:var(--accent);box-shadow:0 10px 26px -12px rgba(0,0,0,.8);}
  .panel .btn:hover{filter:brightness(1.08);}

  .result{margin-top:16px;border-radius:13px;border:1px solid var(--field-brd);background:rgba(4,7,18,.6);overflow:hidden;display:none;}
  .result.show{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .result-bar{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--field-brd);background:rgba(255,255,255,.03);}
  .result-bar span{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--ink-soft);text-transform:uppercase;}
  .mini{cursor:pointer;border:1px solid var(--field-brd);background:rgba(255,255,255,.06);color:var(--ink);
    border-radius:8px;padding:6px 13px;font-size:12px;font-weight:600;transition:background .15s ease;-webkit-tap-highlight-color:transparent;}
  .mini:hover{background:rgba(255,255,255,.14);}
  pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;color:#e6ebff;
    max-height:340px;overflow:auto;}

  #toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:linear-gradient(100deg,#10b981,#059669);color:#fff;font-weight:700;font-size:14px;
    padding:12px 20px;border-radius:12px;box-shadow:0 16px 40px -12px rgba(16,185,129,.7);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{text-align:center;margin-top:40px;color:var(--ink-dim);font-size:12px;}

  pre::-webkit-scrollbar,textarea::-webkit-scrollbar{width:8px;height:8px;}
  pre::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;}
  pre::-webkit-scrollbar-track,textarea::-webkit-scrollbar-track{background:transparent;}

  /* On phones: show segmented control, one panel at a time */
  @media(max-width:1080px){
    .tabs{display:flex;}
    .grid .panel{display:none;}
    body[data-active="0"] .grid .panel[data-i="0"],
    body[data-active="1"] .grid .panel[data-i="1"],
    body[data-active="2"] .grid .panel[data-i="2"]{display:block;}
    .panel:hover{transform:none;}
  }
</style>
</head>
<body data-active="0">
  <div class="wrap">
    <header>
      <div class="badge"><span class="dot"></span> Installable · Works offline</div>
      <h1>TG Sales Report Generator</h1>
      <p>Build up to three formatted reports — paste the raw hourly data, generate, copy.</p>
    </header>

    <div class="toolbar">
      <button class="btn btn-primary" id="gen-all">⚡ Generate All</button>
      <button class="btn btn-ghost" id="copy-all">📋 Copy All</button>
      <button class="btn btn-ghost" id="clear-all">↺ Clear All</button>
    </div>

    <div class="tabs" id="tabs">
      <button data-t="0" class="active">Report 1<span class="sub">Maestro</span></button>
      <button data-t="1">Report 2<span class="sub">Pinzatta</span></button>
      <button data-t="2">Report 3<span class="sub">MAD</span></button>
    </div>

    <div class="grid" id="grid"></div>

    <footer>TG Sales Report Generator v3.3 · PWA · self-contained · works offline</footer>
  </div>

  <div id="toast"></div>

<script>
(function(){
  "use strict";

  var BRANDS = ["Maestro","Pinzatta","MAD"];
  var DEFAULTS = ["Maestro","Pinzatta","MAD"];
  var PLACEHOLDER =
    "TOTAL SALES: 1,234,567.89\n" +
    "This week is 5.5% higher than past week\n\n" +
    "App: 1,200 orders / 600,000.00 SR\n" +
    "45.0% orders, 48.6% sales\n" +
    "📈-W: +12.0% sales";

  /* ---------- calculation engine (pure) ---------- */
  function getStatusIcon(p){
    if(p>0) return "🟢";
    if(p<=0 && p>=-30) return "🟡";
    return "🔴";
  }
  function formatSales(value,type,brand){
    type=type||"overall";
    var MILLION=1000000;
    if(value>=MILLION) return (value/MILLION).toFixed(2)+" Mn";
    var thousands=value/1000, decimals=1;
    if(brand.toLowerCase()==="maestro" && type==="overall") decimals=0;
    return thousands.toFixed(decimals)+"K";
  }
  function joinWithCommasAndAmp(arr){
    if(!arr||arr.length===0) return "";
    if(arr.length===1) return arr[0];
    if(arr.length===2) return arr.join(" & ");
    return arr.slice(0,-1).join(", ")+" & "+arr[arr.length-1];
  }

  function buildReport(brand, lwSalesInput, rawInput){
    var lines = rawInput.split("\n").map(function(l){return l.trim();});

    var totalSales=0;
    var totalSalesLine = lines.find(function(l){return l.toUpperCase().indexOf("TOTAL SALES:")!==-1;});
    if(totalSalesLine){
      var tm=totalSalesLine.match(/TOTAL SALES:\s*([\d,.]+)/i);
      if(tm) totalSales=parseFloat(tm[1].replace(/,/g,""));
    }

    var rawWeekGrowth=0, hasWeekGrowth=false;
    var gi=lines.findIndex(function(l){return l.toLowerCase().indexOf("than past week")!==-1;});
    if(gi!==-1){
      hasWeekGrowth=true;
      var gm=lines[gi].match(/([+-]?[\d.]+)%/);
      if(gm) rawWeekGrowth=parseFloat(gm[1]);
    }

    var platformsToCheck;
    if(brand==="Maestro") platformsToCheck=["App","Web","Delivery","HungerStation","Jahez","Keeta KSA","Ninja"];
    else if(brand==="Pinzatta"||brand==="MAD") platformsToCheck=["HungerStation","Jahez","Keeta KSA","The Chefz","ToYou","Ninja"];
    else platformsToCheck=[];

    function parsePlatformBlock(name){
      var idx=lines.findIndex(function(l){return l.toLowerCase().indexOf(name.toLowerCase()+":")===0;});
      if(idx===-1) return null;
      var platform={name:name,orders:0,sales:0,shareSales:0,weeklySalesChange:0,weeklySalesIcon:""};

      var mm=lines[idx].match(/[^:]+:\s*([\d,.]+)\s*orders.*?([\d,.]+)\s*SR/i);
      if(mm){
        platform.orders=parseFloat(mm[1].replace(/,/g,""));
        platform.sales=parseFloat(mm[2].replace(/,/g,""));
      }

      var shareLine=lines[idx+2], sm=null;
      if(shareLine) sm=shareLine.match(/([\d.]+)% orders,\s*([\d.]+)% sales/i);
      if(!sm && (idx+1<lines.length)){
        shareLine=lines[idx+1];
        if(shareLine) sm=shareLine.match(/([\d.]+)% orders,\s*([\d.]+)% sales/i);
      }
      if(sm) platform.shareSales=parseFloat(sm[2]);

      var weeklyLine="";
      for(var i=idx;i<idx+5 && i<lines.length;i++){
        if(lines[i] && lines[i].indexOf("📈-W:")!==-1){ weeklyLine=lines[i]; break; }
      }
      if(weeklyLine){
        var wm=weeklyLine.match(/([+-][\d.]+)% sales/i);
        if(wm){
          platform.weeklySalesChange=parseFloat(wm[1]);
          platform.weeklySalesIcon=getStatusIcon(platform.weeklySalesChange);
        }
      }
      return platform;
    }

    var parsed=platformsToCheck.map(parsePlatformBlock).filter(Boolean).map(function(p){
      if(p.name.toLowerCase()==="hungerstation") p.name="Hunger";
      else if(p.name.toLowerCase()==="keeta ksa") p.name="Keeta";
      return p;
    });

    var formattedOverallSales=formatSales(totalSales,"overall",brand);
    var lwSalesNum=parseFloat(lwSalesInput), formattedLW="", formattedEst="";
    if(!isNaN(lwSalesNum) && lwSalesNum>0 && hasWeekGrowth){
      var est=lwSalesNum*(1+rawWeekGrowth/100);
      formattedLW=formatSales(lwSalesNum,"lw",brand);
      formattedEst=formatSales(est,"est",brand);
    }

    var out=[];
    out.push("["+brand+"]");
    if(hasWeekGrowth){
      out.push("Overall Sales "+formattedOverallSales+" SR | "+Math.round(Math.abs(rawWeekGrowth))+"% "+getStatusIcon(rawWeekGrowth));
    } else {
      out.push("Overall Sales "+formattedOverallSales+" SR");
    }
    if(formattedEst && formattedLW) out.push("Est sales: "+formattedEst+", LW Sales: "+formattedLW);
    out.push("");

    var declines=[];
    parsed.forEach(function(p){
      if(p.weeklySalesIcon){
        out.push(p.name+" "+Math.round(Math.abs(p.weeklySalesChange))+"% "+p.weeklySalesIcon);
        if(p.weeklySalesChange<-30) declines.push(p.name);
      }
    });
    if(parsed.some(function(p){return p.weeklySalesIcon;})) out.push("");
    if(declines.length>0){
      out.push("*"+joinWithCommasAndAmp(declines)+" witnessed a significant decline*");
      out.push("");
    }
    var shares=parsed.filter(function(p){return p.shareSales>0;})
      .map(function(p){return p.name+" "+Math.round(p.shareSales)+"%";});
    if(shares.length>0) out.push("% of overall - "+shares.join(", "));

    return out.join("\n");
  }

  /* ---------- UI ---------- */
  var grid=document.getElementById("grid");
  var panels=[];

  function makePanel(i){
    var el=document.createElement("div");
    el.className="panel"; el.setAttribute("data-i",i);
    var opts=BRANDS.map(function(b){
      return '<option value="'+b+'"'+(b===DEFAULTS[i]?" selected":"")+'>'+b+'</option>';
    }).join("");
    el.innerHTML=
      '<div class="panel-head">'+
        '<div class="panel-title"><span class="panel-num">'+(i+1)+'</span> Report '+(i+1)+'</div>'+
        '<span class="panel-tag">Independent</span>'+
      '</div>'+
      '<div class="row">'+
        '<div><label>Brand</label><select class="f-brand">'+opts+'</select></div>'+
        '<div><label>Last Week’s Sales (SR)</label><input class="f-lw" type="text" inputmode="numeric" placeholder="e.g. 1520000"></div>'+
      '</div>'+
      '<label>Paste Hourly Sales Report Data</label>'+
      '<textarea class="f-raw" placeholder="'+PLACEHOLDER.replace(/"/g,"&quot;").replace(/\n/g,"&#10;")+'"></textarea>'+
      '<p class="hint">Needs <b>TOTAL SALES:</b>, optionally a <b>than past week</b> line, and platform rows.</p>'+
      '<button class="btn f-gen">Generate Report '+(i+1)+'</button>'+
      '<div class="result">'+
        '<div class="result-bar"><span>Generated Report</span><button class="mini f-copy">Copy</button></div>'+
        '<pre class="f-out"></pre>'+
      '</div>';
    grid.appendChild(el);

    var brand=el.querySelector(".f-brand");
    var lw=el.querySelector(".f-lw");
    var raw=el.querySelector(".f-raw");
    var out=el.querySelector(".f-out");
    var resultBox=el.querySelector(".result");

    lw.addEventListener("input",function(){this.value=this.value.replace(/[^0-9.]/g,"");});

    function run(){
      try{ out.textContent=buildReport(brand.value, lw.value, raw.value); }
      catch(err){ out.textContent="Error: Could not generate report. Please check input format.\nDetails: "+err.message; }
      resultBox.classList.add("show");
    }
    el.querySelector(".f-gen").addEventListener("click",run);
    el.querySelector(".f-copy").addEventListener("click",function(){ copyText(out.textContent); });

    panels.push({ run:run, getResult:function(){return out.textContent;},
      hasResult:function(){return resultBox.classList.contains("show");},
      clear:function(){ lw.value=""; raw.value=""; out.textContent=""; resultBox.classList.remove("show"); } });
  }
  for(var i=0;i<3;i++) makePanel(i);

  /* Mobile tabs */
  var tabBtns=document.querySelectorAll("#tabs button");
  tabBtns.forEach(function(b){
    b.addEventListener("click",function(){
      tabBtns.forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      document.body.setAttribute("data-active", b.getAttribute("data-t"));
    });
  });

  /* Global actions */
  document.getElementById("gen-all").addEventListener("click",function(){
    panels.forEach(function(p){p.run();});
    toast("All three reports generated");
  });
  document.getElementById("copy-all").addEventListener("click",function(){
    var parts=panels.filter(function(p){return p.hasResult() && p.getResult().trim();}).map(function(p){return p.getResult();});
    if(parts.length===0){ toast("Nothing to copy yet"); return; }
    copyText(parts.join("\n\n———\n\n"), parts.length+" report(s) copied");
  });
  document.getElementById("clear-all").addEventListener("click",function(){
    panels.forEach(function(p){p.clear();});
    toast("Cleared");
  });

  /* Clipboard + toast */
  function copyText(text, msg){
    msg=msg||"Copied to clipboard";
    function done(){ toast(msg); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(text,done); });
    } else { fallback(text,done); }
  }
  function fallback(text,done){
    try{
      var ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.top="-9999px"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }catch(e){ toast("Couldn't copy — select manually"); }
  }
  var toastEl=document.getElementById("toast"), toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove("show");},2400);
  }

  /* Service worker for offline use */
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
